<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>買い物計画アプリ - リアルタイム共有版</title>
<style>
body { font-family: sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
h1 { text-align: center; color: #4a4a58; }
.container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
.input-group { display: flex; gap: 10px; margin-bottom: 15px; }
input[type="text"] { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
input[type="number"] { width: 100px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
button { padding: 10px 15px; background-color: #5c6bc0; color: white; border: none; border-radius: 4px; cursor: pointer; }
button:hover { background-color: #3f51b5; }
ul { list-style: none; padding: 0; position: relative; }
li { 
  background: #f9f9f9; 
  border: 1px solid #eee; 
  margin-bottom: 8px; 
  padding: 12px; 
  border-radius: 4px; 
  display: flex; 
  justify-content: space-between; 
  align-items: center; 
  touch-action: none; 
  user-select: none;
}
li.dragging { opacity: 0.7; background: #e0e0e0; border: 2px dashed #5c6bc0; }
.gauge-container { margin-top: 30px; }
.gauge-label { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px; }
.gauge-bar-bg { background-color: #e0e0e0; border-radius: 10px; height: 20px; overflow: hidden; }
.gauge-bar-fill { height: 100%; width: 0%; background-color: #4caf50; transition: width 0.3s; }
.item-price { font-weight: bold; color: #555; }
.delete-btn { background-color: #ff5252; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin-left: 10px; }
.delete-btn:hover { background-color: #d32f2f; }
.room-box { background: #e8eaf6; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
.room-status { font-size: 0.85em; color: #5c6bc0; text-align: center; font-weight: bold; margin-top: 5px; }
</style>
</head>
<body>

<div class="container">
<h1>買い物計画</h1>

<!-- ルーム機能エリア -->
<div class="room-box">
  <div class="input-group" style="margin-bottom: 0;">
    <input type="text" id="roomIdInput" placeholder="合言葉（ルームID）を入力">
    <button onclick="window.joinRoom()">接続</button>
    <button onclick="window.generateRoom()" style="background-color: #4caf50;">新規発行</button>
  </div>
  <div id="roomStatus" class="room-status">未接続（ローカル保存中）</div>
</div>

<div class="input-group">
<input type="text" id="itemName" placeholder="欲しいものを入力">
<input type="number" id="itemPrice" placeholder="価格">
<button onclick="window.addItem()">追加</button>
</div>

<ul id="itemList"></ul>

<div class="gauge-container">
<div class="gauge-label">
<span>合計金額</span>
<span id="totalDisplay">¥0</span>
</div>
<div class="gauge-bar-bg">
<div id="gaugeBar" class="gauge-bar-fill"></div>
</div>
</div>
</div>

<!-- Firebase CDN読み込みと初期化 -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDA9MSoP5GXpHqhzeHShGEwLfVgxjlCTxI",
  authDomain: "yosankeikaku.firebaseapp.com",
  projectId: "yosankeikaku",
  storageBucket: "yosankeikaku.firebasestorage.app",
  messagingSenderId: "612924615172",
  appId: "1:612924615172:web:1e7d51607826018a642351",
  measurementId: "G-S5L0BJLSM5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentRoomId = null;
let unsubscribe = null;
let items = JSON.parse(localStorage.getItem('plannedItems')) || [];
const maxBudget = 100000;

function updateUI() {
  const itemList = document.getElementById('itemList');
  itemList.innerHTML = '';

  let total = 0;
  items.forEach((item, index) => {
    total += item.price;
    const li = document.createElement('li');
    li.dataset.index = index;
    li.innerHTML = `
      <span>${index + 1}. ${item.name}</span>
      <div>
        <span class="item-price">¥${item.price.toLocaleString()}</span>
        <button class="delete-btn" onclick="window.deleteItem(${index})">削除</button>
      </div>
    `;

    li.addEventListener('touchstart', handleTouchStart, { passive: false });
    li.addEventListener('touchmove', handleTouchMove, { passive: false });
    li.addEventListener('touchend', handleTouchEnd);

    itemList.appendChild(li);
  });

  document.getElementById('totalDisplay').innerText = `¥${total.toLocaleString()}`;
  const gaugePercentage = Math.min((total / maxBudget) * 100, 100);
  document.getElementById('gaugeBar').style.width = `${gaugePercentage}%`;

  if (!currentRoomId) {
    localStorage.setItem('plannedItems', JSON.stringify(items));
  }
}

async function syncToFirestore() {
  if (currentRoomId) {
    try {
      const docRef = doc(db, 'rooms', currentRoomId);
      await setDoc(docRef, { items });
    } catch (error) {
      console.error("Firestoreへの保存エラー:", error);
      alert("保存に失敗しました。Firebaseのルール設定を確認してください。");
    }
  } else {
    updateUI();
  }
}

function addItem() {
  const nameInput = document.getElementById('itemName');
  const priceInput = document.getElementById('itemPrice');
  const name = nameInput.value.trim();
  const price = parseInt(priceInput.value);

  if (name && !isNaN(price)) {
    items.push({ name, price });
    nameInput.value = '';
    priceInput.value = '';
    updateUI(); // 画面を先行更新
    syncToFirestore();
  }
}

function deleteItem(index) {
  items.splice(index, 1);
  updateUI(); // 画面を先行更新
  syncToFirestore();
}

function joinRoom(targetId) {
  const roomId = targetId || document.getElementById('roomIdInput').value.trim();
  if (!roomId) return;

  if (unsubscribe) unsubscribe();

  currentRoomId = roomId;
  document.getElementById('roomIdInput').value = roomId;
  document.getElementById('roomStatus').innerText = `接続中：${roomId}`;

  const docRef = doc(db, 'rooms', currentRoomId);
  unsubscribe = onSnapshot(docRef, (snapshot) => {
    if (snapshot.exists()) {
      items = snapshot.data().items || [];
    } else {
      items = [];
      setDoc(docRef, { items });
    }
    updateUI();
  }, (error) => {
    console.error("Firestore受信エラー:", error);
    document.getElementById('roomStatus').innerText = `接続エラー：アクセス権限がありません`;
  });
}

function generateRoom() {
  const randomId = Math.random().toString(36).substring(2, 8).toUpperCase();
  joinRoom(randomId);
}

// タッチドラッグ制御
let draggedIndex = null;
let activeElement = null;

function handleTouchStart(e) {
  if (e.target.tagName === 'BUTTON') return;
  draggedIndex = parseInt(this.dataset.index);
  activeElement = this;
  this.classList.add('dragging');
}

function handleTouchMove(e) {
  if (draggedIndex === null) return;
  e.preventDefault();

  const touch = e.touches[0];
  const targetElement = document.elementFromPoint(touch.clientX, touch.clientY);

  if (!targetElement) return;

  const targetLi = targetElement.closest('li');
  if (targetLi && targetLi !== activeElement) {
    const targetIndex = parseInt(targetLi.dataset.index);
    if (!isNaN(targetIndex)) {
      const movedItem = items.splice(draggedIndex, 1)[0];
      items.splice(targetIndex, 0, movedItem);
      draggedIndex = targetIndex;
      
      const newLis = document.querySelectorAll('#itemList li');
      activeElement = newLis[targetIndex];
      if (activeElement) activeElement.classList.add('dragging');
      
      updateUI();
    }
  }
}

function handleTouchEnd() {
  if (activeElement) {
    activeElement.classList.remove('dragging');
  }
  draggedIndex = null;
  activeElement = null;
  syncToFirestore();
}

window.addItem = addItem;
window.deleteItem = deleteItem;
window.joinRoom = joinRoom;
window.generateRoom = generateRoom;

updateUI();
</script>

</body>
</html>
