<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>買い物＆シフト計画</title>
<!-- 🌟 ファンシー＆ポップな丸ゴシックフォント -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=Yusei+Magic&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #fde8f0;
  --card: #ffffff;
  --ink: #4a3b40;
  --sub: #8c6d75;
  --line: #ffd1dc;
  --ok: #ff5c8d;
  --ng: #ff3b3b;
  --acc: #4db8ff;
  --acc-shadow: #2b93df;
  --room-bg: #fff0f5;
  --deco-left: "🍓";
  --deco-right: "🎀";
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  transition: all 0.3s ease;
}

:root.over-theme {
  --bg: #2b2426;
  --card: #3a3235;
  --ink: #f8ecee;
  --sub: #b39bA1;
  --line: #524448;
  --acc: #ff9f43;
  --acc-shadow: #c87320;
  --room-bg: #332a2d;
  --deco-left: "🍔";
  --deco-right: "🍩";
}

* { 
  box-sizing: border-box; 
  -webkit-tap-highlight-color: transparent; 
}

body { 
  margin: 0; 
  min-height: 100vh;
  background: var(--bg); 
  color: var(--ink); 
  font-family: 'M PLUS Rounded 1c', 'Yusei Magic', sans-serif; 
  letter-spacing: 0.02em;
  overscroll-behavior-y: none;
  transition: background 0.3s ease, color 0.3s ease;
}

.wrap { 
  max-width: 440px; 
  margin: 0 auto; 
  padding: 12px 12px 48px; 
  position: relative;
}

/* 🌟 上部アプリ切り替えタブ */
.app-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}
.tab-btn {
  flex: 1;
  padding: 12px 8px;
  border-radius: 16px;
  background: var(--card);
  border: 2.5px solid var(--line);
  color: var(--sub);
  font-weight: 900;
  font-size: 0.88rem;
  cursor: pointer;
  text-align: center;
  box-shadow: 0 3px 0px var(--line);
  transition: all 0.15s ease;
}
.tab-btn:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0px var(--line);
}
.tab-btn.active {
  background: var(--ok) !important;
  color: #fff !important;
  border-color: #ff3b75 !important;
  box-shadow: 0 3px 0px #e02860 !important;
}

/* ページの切り替え制御 */
.page-section { display: none !important; }
.page-section.active { display: block !important; }

h1 { 
  font-size: 20px; 
  font-weight: 900;
  margin: 4px 0 14px; 
  text-align: center; 
  color: #ff5c8d; 
  text-shadow: 2px 2px 0px #ffffff;
}
:root.over-theme h1 { color: #ff9f43; text-shadow: 2px 2px 0px #000; }

.panel::before { content: var(--deco-left); font-size: 26px; position: absolute; top: -16px; left: 16px; }
.panel::after { content: var(--deco-right); font-size: 26px; position: absolute; top: -16px; right: 16px; }

.room-box {
  background: var(--room-bg);
  padding: 10px 12px;
  border-radius: 18px;
  margin-bottom: 12px;
  border: 2.5px solid var(--line);
}

.history-select {
  width: 100%;
  margin-top: 6px;
  padding: 8px;
  font-size: 0.85rem;
  border-radius: 12px;
  border: 2px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font-weight: 800;
  font-family: inherit;
}

.panel { 
  position: sticky; 
  top: 8px; 
  z-index: 10; 
  background: var(--card); 
  border-radius: 20px; 
  padding: 14px 16px; 
  border: 3.5px solid #ffb6c1;
  box-shadow: 0 4px 0px #ffa0b0;
}

.row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.big { font-size: 28px; font-weight: 900; color: #ff3b75; }
:root.over-theme .big { color: #ff9f43; }

.sub { font-size: 12px; color: var(--sub); font-weight: 800; }

.bar { height: 12px; background: #ffe4e9; border-radius: 99px; overflow: hidden; margin: 8px 0; border: 2px solid #ffccd5; }
.fill { height: 100%; width: 0; background: linear-gradient(90deg, #ff85a2, #ff3b75); border-radius: 99px; transition: width 0.4s ease; }
.fill.over { background: linear-gradient(90deg, #ff6b6b, #ff0000); }

.verdict { font-size: 13px; font-weight: 900; }

label.budget { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--sub); font-weight: 800; }

input, select { 
  font: inherit; 
  font-size: 14px; 
  color: var(--ink); 
  background: #fff8fa; 
  border: 2px solid var(--line);
  border-radius: 14px; 
  padding: 8px; 
  outline: none;
  font-weight: 800;
}

#budget { width: 85px; text-align: right; border: none; background: transparent; font-size: 15px; }

.add { display: flex; gap: 6px; margin: 12px 0; }
#name { flex: 1; }
#price { width: 85px; }

button { 
  font: inherit; 
  font-size: 13px; 
  border: 0; 
  border-radius: 14px; 
  padding: 8px 12px; 
  background: var(--acc); 
  color: #fff; 
  cursor: pointer; 
  font-weight: 900;
  box-shadow: 0 3px 0px var(--acc-shadow);
  transition: all 0.1s ease;
  flex-shrink: 0;
}
button:active { transform: translateY(2px); box-shadow: 0 1px 0px var(--acc-shadow); }

ul { list-style: none; margin: 0; padding: 0; }

li { 
  display: flex; 
  align-items: center; 
  gap: 8px; 
  background: var(--card); 
  border-radius: 16px; 
  padding: 10px 12px; 
  margin-bottom: 8px; 
  border: 2px solid var(--line);
  box-shadow: 0 3px 0px var(--line);
}

li.pending { background: rgba(0, 0, 0, 0.02); opacity: 0.55; box-shadow: none; }
.handle { touch-action: none; width: 20px; color: #ff85a2; font-size: 15px; cursor: grab; font-weight: 900; }
.handle::before { content: "☰"; }
.rank { width: 16px; font-weight: 900; color: #ff5c8d; text-align: center; font-size: 0.9rem; }

.item-content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.nm { font-weight: 800; font-size: 0.9rem; overflow-wrap: anywhere; word-break: break-word; }
.nm.has-url { color: #1e88e5; text-decoration: underline; cursor: pointer; }

.item-sub-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.price-info { display: flex; align-items: baseline; gap: 6px; }
.pr { font-weight: 900; color: #ff3b75; font-size: 1rem; cursor: pointer; }
.cum { font-size: 0.75rem; color: var(--sub); font-weight: 800; }
.btn-group { display: flex; align-items: center; gap: 4px; margin-left: auto; }

.action-btn { background: #f0f0f0; color: #666; padding: 4px 8px; font-size: 10px; border-radius: 8px; font-weight: 900; border: none; box-shadow: 0 2px 0px #ccc; }
.action-btn.active { background: #ffd1dc; color: #ff3b75; box-shadow: 0 2px 0px #ff9eaa; }
.del { background: #ffe5e5; color: #ff3b3b; padding: 4px 8px; border-radius: 8px; font-size: 10px; font-weight: 900; border: none; box-shadow: 0 2px 0px #ffb3b3; }

/* 🗓️ シフト管理UI用スタイル */
.shift-card {
  background: var(--card);
  border-radius: 20px;
  padding: 14px;
  border: 2.5px solid var(--line);
  box-shadow: 0 4px 0px var(--line);
  margin-bottom: 12px;
}
.shift-title { font-size: 1rem; font-weight: 900; color: #ff5c8d; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
.shift-form-row { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
.person-input { display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; font-weight: 800; }

.shift-options { display: flex; gap: 4px; }
.shift-opt-btn {
  padding: 6px 8px;
  font-size: 0.75rem;
  border-radius: 12px;
  border: 2px solid var(--line);
  background: #f9f9f9;
  color: var(--sub);
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 2px 0px var(--line);
  transition: all 0.1s ease;
}
.shift-opt-btn:active { transform: translateY(2px); box-shadow: none; }
.shift-opt-btn.active { background: #ff7597 !important; color: #fff !important; border-color: #ff3b75 !important; box-shadow: 0 2px 0px #e0486e !important; }

/* 統計パネル */
.stats-box {
  background: #fff8fa;
  border-radius: 16px;
  padding: 12px;
  border: 2px dashed #ffb6c1;
  margin-top: 10px;
}
.stats-title { font-size: 0.9rem; font-weight: 900; color: #ff3b75; margin-bottom: 6px; }
.stats-item { font-size: 0.8rem; font-weight: 800; color: var(--sub); margin-bottom: 4px; line-height: 1.4; }

.day-card {
  padding: 8px 0;
  border-bottom: 1px dashed #ffd1dc;
}
.day-card:last-child { border-bottom: none; }
.day-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: 800; }
.day-prob { font-size: 0.72rem; color: #997a82; margin-top: 3px; font-weight: 800; }

.badge-risk { background: #ff9f43; color: #fff; padding: 3px 8px; border-radius: 8px; font-size: 0.75rem; font-weight: 900; }
.badge-warn { background: #ffbe76; color: #fff; padding: 3px 8px; border-radius: 8px; font-size: 0.75rem; font-weight: 900; }
.badge-safe { background: #2ed573; color: #fff; padding: 3px 8px; border-radius: 8px; font-size: 0.75rem; font-weight: 900; }

.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); display: flex; align-items: flex-end; justify-content: center; z-index: 100; }
.modal-overlay.hidden { display: none; }
.modal-content { background: var(--card); border-radius: 24px 24px 0 0; padding: 18px; width: 100%; max-width: 440px; border-top: 4px solid var(--line); }
</style>

<script>
window.changeTab = function(tabName) {
  var shoppingTab = document.getElementById('tabShoppingBtn');
  var shiftTab = document.getElementById('tabShiftBtn');
  var shoppingPage = document.getElementById('pageShopping');
  var shiftPage = document.getElementById('pageShift');

  if (tabName === 'shopping') {
    shoppingTab.classList.add('active');
    shiftTab.classList.remove('active');
    shoppingPage.classList.add('active');
    shiftPage.classList.remove('active');
  } else {
    shiftTab.classList.add('active');
    shoppingTab.classList.remove('active');
    shiftPage.classList.add('active');
    shoppingPage.classList.remove('active');
  }
};
</script>
</head>
<body>
<div class="wrap" id="mainWrap">

  <!-- 🌟 上部アプリ切り替えタブ -->
  <div class="app-tabs">
    <button type="button" class="tab-btn active" id="tabShoppingBtn" onclick="changeTab('shopping')">🍓 買い物計画</button>
    <button type="button" class="tab-btn" id="tabShiftBtn" onclick="changeTab('shift')">🗓️ シフト・遭遇回避</button>
  </div>

  <!-- PAGE 1: 買い物計画 -->
  <div id="pageShopping" class="page-section active">
    <h1 id="titleText">🍓 買い物計画 🎀</h1>

    <div class="room-box">
      <div class="add" style="margin: 0;">
        <input type="text" id="roomIdInput" placeholder="合言葉（ルームID）">
        <button type="button" onclick="window.joinRoom()">接続</button>
      </div>
      <select id="roomHistorySelect" class="history-select" onchange="window.selectRoomFromHistory(this.value)">
        <option value="">📜 過去の合言葉から選ぶ</option>
      </select>
      <div id="roomStatus" class="room-status" style="font-size:0.75rem; text-align:center; margin-top:4px; font-weight:800; color:var(--sub);">未接続（ローカル保存中）</div>
    </div>

    <div class="panel">
      <div class="row">
        <span class="big" id="total">¥0</span>
        <label class="budget">予算 ¥<input type="number" id="budget" inputmode="numeric" min="0"></label>
      </div>
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="verdict" id="verdict"></div>
      <div class="sub" id="remain"></div>
    </div>

    <div class="add">
      <input type="text" id="name" placeholder="欲しいもの" maxlength="40">
      <input type="number" id="price" inputmode="numeric" placeholder="価格(任意)" min="0">
      <button type="button" id="addBtn">追加</button>
    </div>

    <ul id="list"></ul>
  </div>

  <!-- PAGE 2: シフト・遭遇回避管理 -->
  <div id="pageShift" class="page-section">
    <h1>🗓️ シフト・遭遇回避 🍓</h1>

    <div class="shift-card">
      <div class="shift-title">
        <span>📅 日付を選択</span>
        <input type="date" id="shiftDate" style="padding: 6px 10px; font-size: 0.9rem; border-radius: 12px; border: 2px solid var(--line);">
      </div>

      <div class="shift-form-row">
        <!-- 彼女さんのシフト -->
        <div class="person-input">
          <span>彼女のシフト 🎀</span>
          <div class="shift-options">
            <button type="button" class="shift-opt-btn" onclick="window.setShift('her', '17-18')" id="her-17-18">17-18時上がり</button>
            <button type="button" class="shift-opt-btn" onclick="window.setShift('her', '20')" id="her-20">20時上がり</button>
            <button type="button" class="shift-opt-btn" onclick="window.setShift('her', 'off')" id="her-off">休み</button>
          </div>
        </div>

        <!-- あさんのシフト -->
        <div class="person-input">
          <span>あさん 👤</span>
          <div class="shift-options">
            <button type="button" class="shift-opt-btn" onclick="window.setShift('a', '17-18')" id="a-17-18">17-18時上がり</button>
            <button type="button" class="shift-opt-btn" onclick="window.setShift('a', '20')" id="a-20">20時上がり</button>
            <button type="button" class="shift-opt-btn" onclick="window.setShift('a', 'off')" id="a-off">休み</button>
          </div>
        </div>

        <!-- いさんのシフト -->
        <div class="person-input">
          <span>いさん 👤</span>
          <div class="shift-options">
            <button type="button" class="shift-opt-btn" onclick="window.setShift('b', '17-18')" id="b-17-18">17-18時上がり</button>
            <button type="button" class="shift-opt-btn" onclick="window.setShift('b', '20')" id="b-20">20時上がり</button>
            <button type="button" class="shift-opt-btn" onclick="window.setShift('b', 'off')" id="b-off">休み</button>
          </div>
        </div>
      </div>

      <!-- 本日の判定結果 -->
      <div id="shiftResult" style="font-weight: 900; font-size: 0.9rem; text-align: center; padding: 10px; border-radius: 14px; background: #fff8fa;">
        日付を選んでシフトを入力してね！
      </div>
    </div>

    <!-- 📊 曜日別傾向アドバイス（確率数値付き） -->
    <div class="shift-card">
      <div class="shift-title">📊 曜日別重複確率 & シフト提案</div>
      <div class="stats-item" style="color:var(--sub); font-size:0.75rem; margin-bottom:8px;">
        あさん・いさんがその曜日に出勤している確率を数値化しています 🎀
      </div>
      
      <div class="stats-box" id="dayStatsList">
        <!-- 曜日ごとの結果と確率数値がここに自動追加されます -->
      </div>
    </div>
  </div>

</div>

<!-- URL設定モーダル -->
<div id="urlModal" class="modal-overlay hidden">
  <div class="modal-content">
    <div style="font-size: 1rem; font-weight: 900; margin-bottom: 10px;" id="modalItemTitle">URLを設定</div>
    <input type="url" id="modalUrlInput" placeholder="https://example.com/item" style="width: 100%;">
    <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px;">
      <button type="button" onclick="window.closeUrlModal()" style="background:#eee; color:#666;">キャンセル</button>
      <button type="button" onclick="window.saveUrlModal()">保存</button>
    </div>
  </div>
</div>

<!-- 🌟 UIおよび標準機能のJavaScript -->
<script>
var shiftData = {};
try { shiftData = JSON.parse(localStorage.getItem('shiftData')) || {}; } catch(e) {}

var daysOfWeek = ['日', '月', '火', '水', '木', '金', '土'];

// ページ読み込み完了時の初期設定
window.addEventListener('DOMContentLoaded', function() {
  var now = new Date();
  var yyyy = now.getFullYear();
  var mm = String(now.getMonth() + 1).padStart(2, '0');
  var dd = String(now.getDate()).padStart(2, '0');
  var todayStr = yyyy + '-' + mm + '-' + dd;

  var shiftDateInput = document.getElementById('shiftDate');
  if (shiftDateInput) {
    shiftDateInput.value = todayStr;
    shiftDateInput.addEventListener('change', function() {
      updateShiftUI();
    });
  }
  updateShiftUI();
});

window.setShift = function(person, val) {
  var shiftDateInput = document.getElementById('shiftDate');
  var date = shiftDateInput ? shiftDateInput.value : '';
  if (!date) return;
  if (!shiftData[date]) shiftData[date] = { her: 'off', a: 'off', b: 'off' };
  shiftData[date][person] = val;
  updateShiftUI();
  if (window.triggerSave) window.triggerSave();
};

function updateShiftUI() {
  var shiftDateInput = document.getElementById('shiftDate');
  var date = shiftDateInput ? shiftDateInput.value : '';
  var data = shiftData[date] || { her: 'off', a: 'off', b: 'off' };

  ['her', 'a', 'b'].forEach(function(p) {
    ['17-18', '20', 'off'].forEach(function(v) {
      var btn = document.getElementById(p + '-' + v);
      if (btn) {
        if (data[p] === v) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      }
    });
  });

  var resEl = document.getElementById('shiftResult');
  if (!resEl) return;

  if (data.her === 'off') {
    resEl.innerHTML = '<span class="badge-safe">🌸 休日</span> 彼女さんはお休みです！ゆっくり過ごしてね 🍓';
  } else {
    var sameShift = [];
    if (data.a === data.her) sameShift.push('あさん');
    if (data.b === data.her) sameShift.push('いさん');

    var otherShift = [];
    if (data.a !== 'off' && data.a !== data.her) otherShift.push('あさん');
    if (data.b !== 'off' && data.b !== data.her) otherShift.push('いさん');

    var labelStr = data.her === '17-18' ? '17-18時' : '20時';

    if (sameShift.length > 0) {
      resEl.innerHTML = '<span class="badge-risk">⚠️ 退勤時間一致</span><br>' + sameShift.join('・') + 'と上がりの時間が同じ(' + labelStr + ')です';
    } else if (otherShift.length > 0) {
      resEl.innerHTML = '<span class="badge-warn">⚡️ 同日出勤</span><br>' + otherShift.join('・') + 'と同じ日に出勤しています';
    } else {
      resEl.innerHTML = '<span class="badge-safe">🌸 単独出勤</span> 他のメンバーとの上がり時間の重複はありません 🎀';
    }
  }

  calculateStats();
}

// 曜日別の分析・おすすめ判定・数値確率計算
function calculateStats() {
  var statsByDay = {};
  for (var i = 0; i < 7; i++) {
    statsByDay[i] = { '17-18': 0, '20': 0, totalDays: 0 };
  }

  Object.keys(shiftData).forEach(function(dateStr) {
    var d = shiftData[dateStr];
    if (!d) return;
    var dateObj = new Date(dateStr);
    var dayIdx = dateObj.getDay();
    if (isNaN(dayIdx)) return;

    if (d.a !== 'off' || d.b !== 'off' || d.her !== 'off') {
      statsByDay[dayIdx].totalDays++;
    }

    if (d.a === '17-18' || d.b === '17-18') {
      statsByDay[dayIdx]['17-18']++;
    }
    if (d.a === '20' || d.b === '20') {
      statsByDay[dayIdx]['20']++;
    }
  });

  var listEl = document.getElementById('dayStatsList');
  if (!listEl) return;

  var html = '';
  var hasAnyData = false;

  for (var day = 0; day < 7; day++) {
    var st = statsByDay[day];
    if (st.totalDays > 0) hasAnyData = true;

    var dayName = daysOfWeek[day] + '曜日';
    var c17 = st['17-18'];
    var c20 = st['20'];
    var total = st.totalDays || 1;

    var prob17 = Math.round((c17 / total) * 100);
    var prob20 = Math.round((c20 / total) * 100);

    var advice = '';
    if (st.totalDays === 0) {
      advice = 'データなし';
    } else if (prob17 < prob20) {
      advice = '👉 <b style="color:#ff3b75;">17-18時上がり</b> が安全 🍓';
    } else if (prob20 < prob17) {
      advice = '👉 <b style="color:#ff3b75;">20時上がり</b> が安全 🎀';
    } else {
      advice = '同等の重複率';
    }

    var probStr = st.totalDays > 0 ? '重複率 (17-18時: <b>' + prob17 + '%</b> / 20時: <b>' + prob20 + '%</b>)' : 'データがありません';

    html += '<div class="day-card">' +
              '<div class="day-header">' +
                '<span><b>' + dayName + '</b></span>' +
                '<span>' + advice + '</span>' +
              '</div>' +
              '<div class="day-prob">' + probStr + '</div>' +
            '</div>';
  }

  if (!hasAnyData) {
    listEl.innerHTML = '<div style="text-align:center; padding:8px; color:var(--sub); font-weight:800;">データを入力すると曜日ごとの確率とおすすめが表示されます！</div>';
  } else {
    listEl.innerHTML = html;
  }
}
</script>

<!-- 🌟 Firebaseとオンライン同期機能のJavaScript -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDA9MSoP5GXpHqhzeHShGEwLfVgxjlCTxI",
  authDomain: "yosankeikaku.firebaseapp.com",
  projectId: "yosankeikaku",
  storageBucket: "yosankeikaku.firebasestorage.app",
  messagingSenderId: "612924615172",
  appId: "1:612924615172:web:1e7d51607826018a642351",
  measurementId: "G-S5L0BJLSM5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const yen = n => (n === null || n === undefined || isNaN(n)) ? '¥未定' : '¥' + n.toLocaleString('ja-JP');

let items = [];
let budget = 100000;
let currentRoomId = null;
let unsubscribe = null;
let roomHistory = [];
let editingItemId = null;

try {
  items = JSON.parse(localStorage.getItem('plannedItems')) || [];
  const b = parseInt(localStorage.getItem('plannedBudget'), 10);
  if (!isNaN(b)) budget = b;
  roomHistory = JSON.parse(localStorage.getItem('roomHistory')) || [];
} catch (e) {}

items = items.filter(i => i && typeof i.name === 'string')
             .map((i, k) => ({ 
               id: i.id || Date.now() + '-' + k, 
               name: i.name, 
               price: (i.price === null || i.price === undefined || isNaN(i.price)) ? null : i.price, 
               url: i.url || '',
               pending: !!i.pending 
             }));
if ($('budget'))$('budget').value = budget;

function updateHistoryUI() {
  const select = $('roomHistorySelect');
  if (!select) return;
  select.innerHTML = '<option value="">📜 過去の合言葉から選ぶ</option>';
  roomHistory.forEach(id => {
    const opt = document.createElement('option'); opt.value = id; opt.textContent = id; select.appendChild(opt);
  });
}
updateHistoryUI();

async function save() {
  if (currentRoomId) {
    try { await setDoc(doc(db, 'rooms', currentRoomId), { items, budget, shiftData }); } catch (e) {}
  } else {
    try {
      localStorage.setItem('plannedItems', JSON.stringify(items));
      localStorage.setItem('plannedBudget', String(budget));
      localStorage.setItem('shiftData', JSON.stringify(shiftData));
    } catch (e) {}
  }
}
window.triggerSave = save;

function render() {
  const ul = $('list');
  if (!ul) return;
  ul.innerHTML = '';
  if (!items.length) {
    const activeItems = items.filter(i => !i.pending && i.price !== null);
    const isOver = activeItems.reduce((s, i) => s + (i.price || 0), 0) > budget;
    ul.innerHTML = `<div style="text-align:center; padding:24px; font-weight:800; color:var(--sub)">欲しいものを追加してください ${isOver ? '🍔' : '🍓'}</div>`;
  }
  items.forEach(it => {
    const li = document.createElement('li');
    li.dataset.id = it.id;
    if (it.pending) li.classList.add('pending');
    
    const hasUrl = it.url && it.url.trim() !== '';
    const urlBtnText = hasUrl ? '🔗' : 'URL';
    const nmClass = hasUrl ? 'nm has-url' : 'nm';
    const isPriceUnset = it.price === null || it.price === undefined;

    li.innerHTML = '<div class="handle"></div><div class="rank"></div>' +
      '<div class="item-content">' +
        `<div class="${nmClass}">${it.name}</div>` +
        '<div class="item-sub-row">' +
          '<div class="price-info">' +
            `<div class="pr ${isPriceUnset ? 'unset' : ''}">${yen(it.price)}</div>` +
            '<div class="cum"></div>' +
          '</div>' +
          '<div class="btn-group">' +
            `<button type="button" class="action-btn hold-btn ${it.pending ? 'active' : ''}">${it.pending ? '保留中' : '保留'}</button>` +
            `<button type="button" class="action-btn url-btn ${hasUrl ? 'active' : ''}">${urlBtnText}</button>` +
            '<button type="button" class="del">✕</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    ul.appendChild(li);
  });
  refresh();
}

function refresh() {
  const byId = Object.fromEntries(items.map(i => [i.id, i]));
  let cum = 0, fit = 0, activeRank = 0, total = 0;

  document.querySelectorAll('#list li').forEach((li) => {
    const it = byId[li.dataset.id];
    if (!it) return;
    if (it.pending) {
      li.querySelector('.rank').textContent = '-';
      li.querySelector('.cum').textContent = '(保留中)';
    } else {
      activeRank++;
      const itemPrice = it.price || 0;
      cum += itemPrice; total += itemPrice;
      const ok = cum <= budget;
      if (ok && fit === activeRank - 1) fit = activeRank;
      li.querySelector('.rank').textContent = activeRank;
      li.querySelector('.cum').textContent = it.price === null ? '' : '(累計 ' + yen(cum) + ')';
    }
  });
  
  const totalActive = items.filter(i => !i.pending).reduce((s, i) => s + (i.price || 0), 0);
  const isOver = totalActive > budget;
  document.documentElement.classList.toggle('over-theme', isOver);
  if ($('total'))$('total').textContent = yen(totalActive);
  const pct = budget > 0 ? Math.min(totalActive / budget * 100, 100) : (totalActive ? 100 : 0);
  if ($('fill')) {
    $('fill').style.width = pct + '\%';$('fill').classList.toggle('over', isOver);
  }
  
  const activeCount = items.filter(i => !i.pending).length;
  if ($('verdict')) {$('verdict').textContent = !activeCount ? '' : fit === activeCount ? `全${fit}件、予算内だよん 🎀`
      : fit === 0 ? '1位でも予算を超えています...😭' : `予算内で買えるのは ${fit}位 まで 🍔`;
  }
  if ($('remain')) {$('remain').textContent = !activeCount ? '' : totalActive <= budget ? `残り ${yen(budget - totalActive)}` : `${yen(totalActive - budget)} 超過...😭`;
  }
}

if ($('addBtn')) {$('addBtn').addEventListener('click', () => {
    const name = $('name').value.trim(), priceVal =$('price').value.trim();
    if (!name) return;
    const price = priceVal === '' ? null : parseInt(priceVal, 10);
    items.push({ id: Date.now() + '-' + Math.random().toString(36).slice(2, 6), name, price: (isNaN(price) || price < 0) ? null : price, url: '', pending: false });
    $('name').value = '';$('price').value = ''; render(); save();
  });
}

if ($('budget')) {$('budget').addEventListener('input', e => { budget = Math.max(parseInt(e.target.value, 10) || 0, 0); refresh(); save(); });
}

if ($('list')) {$('list').addEventListener('click', e => {
    const li = e.target.closest('li'); if (!li) return;
    const item = items.find(i => i.id === li.dataset.id); if (!item) return;
    if (e.target.classList.contains('nm') && item.url) window.open(/^https?:\/\//i.test(item.url) ? item.url : 'https://' + item.url, '_blank');
    if (e.target.classList.contains('pr')) {
      const p = prompt(`「${item.name}」の価格を入力:`, item.price === null ? '' : item.price);
      if (p !== null) { item.price = isNaN(parseInt(p,10)) ? null : parseInt(p,10); render(); save(); }
    }
    if (e.target.classList.contains('hold-btn')) { item.pending = !item.pending; render(); save(); }
    if (e.target.classList.contains('url-btn')) { editingItemId = item.id; $('modalUrlInput').value = item.url \vert{}\vert{} '';$('urlModal').classList.remove('hidden'); }
    if (e.target.classList.contains('del')) { items = items.filter(i => i.id !== item.id); render(); save(); }
  });
}

window.closeUrlModal = () => $('urlModal').classList.add('hidden');
window.saveUrlModal = () => {
  const item = items.find(i => i.id === editingItemId);
  if (item) { item.url = $('modalUrlInput').value.trim(); render(); save(); }
  closeUrlModal();
};

window.joinRoom = function(targetId) {
  const roomId = targetId || $('roomIdInput').value.trim(); if (!roomId) return;
  roomHistory = [roomId, ...roomHistory.filter(id => id !== roomId)];
  try { localStorage.setItem('roomHistory', JSON.stringify(roomHistory)); } catch (e) {}
  updateHistoryUI();
  if (unsubscribe) unsubscribe();
  currentRoomId = roomId; $('roomIdInput').value = roomId;
  if ($('roomStatus'))$('roomStatus').textContent = '接続中: ' + roomId;
  const docRef = doc(db, 'rooms', currentRoomId);
  unsubscribe = onSnapshot(docRef, (snapshot) => {
    if (snapshot.exists()) {
      const data = snapshot.data();
      items = data.items || []; if (data.budget !== undefined) { budget = data.budget; $('budget').value = budget; }
      if (data.shiftData) { shiftData = data.shiftData; updateShiftUI(); }
    } else { setDoc(docRef, { items, budget, shiftData }); }
    render();
  });
};

window.selectRoomFromHistory = val => { if (val) window.joinRoom(val); };

render();
</script>
</body>
</html>
