<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>買い物計画</title>
<!-- 🌟 ファンシー＆ポップな可愛いフォントを読み込み -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=Yusei+Magic&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #fde8f0;
  --card: #ffffff;
  --ink: #4a3b40;
  --sub: #8c6d75;
  --line: #ffd1dc;
  --ok: #ff5c8d;
  --ng: #ff3b3b;
  --acc: #4db8ff; /* ポップな水色ボタン */
  --acc-shadow: #2b93df;
  --btn-pink: #ff7597;
  --btn-pink-shadow: #e0486e;
  --room-bg: #fff0f5;
  --deco-left: "🍓";
  --deco-right: "🎀";
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  transition: all 0.3s ease;
}

/* 🍔🍩 予算オーバー時：ジャンク＆ダークポップテーマ */
:root.over-theme {
  --bg: #2b2426;
  --card: #3a3235;
  --ink: #f8ecee;
  --sub: #b39bA1;
  --line: #524448;
  --acc: #ff9f43;
  --acc-shadow: #c87320;
  --btn-pink: #d9534f;
  --btn-pink-shadow: #a9322e;
  --room-bg: #332a2d;
  --deco-left: "🍔";
  --deco-right: "🍩";
}

* { 
  box-sizing: border-box; 
  -webkit-tap-highlight-color: transparent; 
  user-select: none;
}

body { 
  margin: 0; 
  min-height: 100vh;
  background: var(--bg); 
  color: var(--ink); 
  font-family: 'M PLUS Rounded 1c', 'Yusei Magic', sans-serif; 
  letter-spacing: 0.02em;
  overscroll-behavior-y: none;
  transition: background 0.3s ease, color 0.3s ease;
}

@keyframes shake {
  0% { transform: translate(0, 0); }
  20% { transform: translate(-4px, 3px); }
  40% { transform: translate(4px, -3px); }
  60% { transform: translate(-3px, -2px); }
  80% { transform: translate(3px, 2px); }
  100% { transform: translate(0, 0); }
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.wrap { 
  max-width: 440px; 
  margin: 0 auto; 
  padding: 16px 16px 48px; 
  position: relative;
}

.wrap.shock {
  animation: shake 0.4s ease-in-out;
}

h1 { 
  font-size: 22px; 
  font-weight: 900;
  margin: 8px 0 16px; 
  text-align: center; 
  color: #ff5c8d; 
  text-shadow: 2px 2px 0px #ffffff, 4px 4px 0px rgba(255, 182, 193, 0.4);
}
:root.over-theme h1 {
  color: #ff9f43;
  text-shadow: 2px 2px 0px #000000;
}

.panel::before {
  content: var(--deco-left);
  font-size: 28px;
  position: absolute;
  top: -16px;
  left: 16px;
}

.panel::after {
  content: var(--deco-right);
  font-size: 28px;
  position: absolute;
  top: -16px;
  right: 16px;
}

/* ぷっくりかわいらしいカード＆枠線スタイル */
.room-box {
  background: var(--room-bg);
  padding: 12px 14px;
  border-radius: 20px;
  margin-bottom: 16px;
  border: 3px solid var(--line);
  box-shadow: 0 4px 0px var(--line);
}

.room-status { 
  font-size: 0.8em; 
  color: var(--sub); 
  text-align: center; 
  font-weight: 800; 
  margin-top: 6px; 
}

.history-select {
  width: 100%;
  margin-top: 8px;
  padding: 8px 12px;
  font-size: 0.88rem;
  border-radius: 14px;
  border: 2px solid var(--line);
  background: var(--card);
  color: var(--ink);
  outline: none;
  font-weight: 800;
  font-family: inherit;
}

/* 予算表示パネル（ノート風ぷっくりデザイン） */
.panel { 
  position: sticky; 
  top: 12px; 
  z-index: 10; 
  background: var(--card); 
  border-radius: 24px; 
  padding: 18px 20px; 
  border: 3.5px solid #ffb6c1;
  box-shadow: 0 6px 0px #ffa0b0;
}
:root.over-theme .panel {
  border-color: #ff9f43;
  box-shadow: 0 6px 0px #d87d20;
}

.row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.big { font-size: 32px; font-weight: 900; color: #ff3b75; letter-spacing: -0.02em; }
:root.over-theme .big { color: #ff9f43; }

.sub { font-size: 13px; color: var(--sub); font-weight: 800; }

/* ゲージバー */
.bar { height: 14px; background: #ffe4e9; border-radius: 99px; overflow: hidden; margin: 12px 0 8px; border: 2px solid #ffccd5; }
.fill { height: 100%; width: 0; background: linear-gradient(90deg, #ff85a2, #ff3b75); border-radius: 99px; transition: width 0.4s ease; }
.fill.over { background: linear-gradient(90deg, #ff6b6b, #ff0000); }

.verdict { font-size: 14px; font-weight: 900; color: var(--ink); }

label.budget { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--sub); font-weight: 800; }

/* ぷっくり入力フォーム */
input { 
  font: inherit; 
  font-size: 15px; 
  color: var(--ink); 
  background: #fff8fa; 
  border: 2.5px solid var(--line);
  border-radius: 16px; 
  padding: 8px 12px; 
  min-width: 0; 
  outline: none;
  font-weight: 800;
}
:root.over-theme input {
  background: rgba(255, 255, 255, 0.08);
}
input:focus { border-color: var(--acc); }

#budget { width: 96px; text-align: right; font-weight: 900; background: transparent; border: none; padding: 2px 0; font-size: 16px; }

.add { display: flex; gap: 8px; margin: 18px 0 14px; }
#name { flex: 1; user-select: text; }
#price { width: 96px; user-select: text; }

/* ぷにぷに押せる3D風ボタン */
button { 
  font: inherit; 
  font-size: 15px; 
  border: 0; 
  border-radius: 18px; 
  padding: 10px 18px; 
  background: var(--acc); 
  color: #fff; 
  cursor: pointer; 
  font-weight: 900;
  box-shadow: 0 4px 0px var(--acc-shadow);
  transition: all 0.1s ease;
}
button:active { 
  transform: translateY(3px); 
  box-shadow: 0 1px 0px var(--acc-shadow); 
}

ul { list-style: none; margin: 0; padding: 0; }

/* 📋 おこづかい帳風リストアイテム */
li { 
  display: flex; 
  align-items: center; 
  gap: 8px; 
  background: var(--card); 
  border-radius: 18px; 
  padding: 10px 12px 10px 6px; 
  margin-bottom: 10px; 
  border: 2.5px solid var(--line);
  box-shadow: 0 4px 0px var(--line);
  animation: slideUp 0.3s ease-out;
  transition: transform 0.2s ease, opacity 0.2s ease;
}

li.over { border-color: #ff8b8b; box-shadow: 0 4px 0px #ffb3b3; }
li.over .nm, li.over .pr { opacity: .4; text-decoration: line-through; }

li.pending {
  background: rgba(0, 0, 0, 0.02);
  opacity: 0.5;
  box-shadow: none;
}
li.pending .rank { color: #aaa; }
li.pending .nm { text-decoration: line-through; }

li.dragging { box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15); position: relative; z-index: 20; transform: scale(1.02); }

.handle { 
  touch-action: none; 
  width: 28px; 
  height: 36px; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  color: #ff85a2; 
  font-size: 16px; 
  cursor: grab; 
  flex: none; 
  font-weight: 900;
}
.handle::before { content: "☰"; }

.rank { width: 20px; font-weight: 900; color: #ff5c8d; flex: none; text-align: center; font-size: 0.95rem; }
.mid { flex: 1; min-width: 0; padding-right: 4px; }

.right-group {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.nm { font-weight: 800; font-size: 0.95rem; overflow-wrap: anywhere; user-select: text; }
.nm.has-url { 
  color: #1e88e5; 
  text-decoration: underline; 
  cursor: pointer; 
}

.cum { font-size: 11px; color: var(--sub); font-weight: 800; margin-top: 2px; }

.pr { 
  font-weight: 900; 
  white-space: nowrap; 
  color: #ff3b75; 
  font-size: 1rem; 
  text-align: right;
  min-width: 68px;
  cursor: pointer;
}
:root.over-theme .pr { color: #ff9f43; }

.pr.unset {
  color: var(--sub);
  font-weight: 800;
  font-size: 0.8rem;
  opacity: 0.6;
}

.action-btn { 
  background: #f0f0f0; 
  color: #666; 
  padding: 6px 10px; 
  font-size: 11px; 
  border: 0; 
  border-radius: 12px; 
  font-weight: 900;
  flex-shrink: 0;
  min-width: 44px;
  text-align: center;
  box-shadow: 0 2px 0px #ccc;
}
.action-btn:active {
  transform: translateY(2px);
  box-shadow: 0 0px 0px #ccc;
}

.action-btn.active {
  background: #ffd1dc;
  color: #ff3b75;
  box-shadow: 0 2px 0px #ff9eaa;
}

.del { 
  background: #ffe5e5; 
  color: #ff3b3b; 
  padding: 6px 8px; 
  border-radius: 12px;
  font-size: 12px; 
  font-weight: 900;
  box-shadow: 0 2px 0px #ffb3b3;
  line-height: 1;
}
.del:active { transform: translateY(2px); box-shadow: none; }

.empty { text-align: center; color: var(--sub); padding: 36px 0; font-weight: 800; font-size: 0.95rem; }

/* ポップアップモーダル */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 100;
}
.modal-overlay.hidden { display: none; }
.modal-content {
  background: var(--card);
  border-radius: 28px 28px 0 0;
  padding: 24px;
  width: 100%;
  max-width: 440px;
  border-top: 4px solid var(--line);
  box-shadow: 0 -10px 20px rgba(0,0,0,0.1);
  animation: slideUp 0.3s ease-out;
}
.modal-title { font-size: 1.1rem; font-weight: 900; color: var(--ink); margin-bottom: 14px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
.btn-cancel { background: #eee; color: #666; box-shadow: 0 3px 0px #ccc; }
</style>
</head>
<body>
<div class="wrap" id="mainWrap">
  <h1 id="titleText">🍓 買い物計画 🎀</h1>

  <!-- ルーム機能 -->
  <div class="room-box">
    <div class="add" style="margin: 0;">
      <input type="text" id="roomIdInput" placeholder="合言葉（ルームID）">
      <button onclick="window.joinRoom()">接続</button>
    </div>
    <select id="roomHistorySelect" class="history-select" onchange="window.selectRoomFromHistory(this.value)">
      <option value="">📜 過去の合言葉から選ぶ</option>
    </select>
    <div id="roomStatus" class="room-status">未接続（ローカル保存中）</div>
  </div>

  <div class="panel">
    <div class="row">
      <span class="big" id="total">¥0</span>
      <label class="budget">予算 ¥<input type="number" id="budget" inputmode="numeric" min="0"></label>
    </div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="verdict" id="verdict"></div>
    <div class="sub" id="remain"></div>
  </div>

  <div class="add">
    <input type="text" id="name" placeholder="欲しいもの" maxlength="40">
    <input type="number" id="price" inputmode="numeric" placeholder="価格(任意)" min="0">
    <button id="addBtn">追加</button>
  </div>

  <ul id="list"></ul>
  <div class="sub" id="footerHint" style="text-align:center;margin-top:20px;opacity:0.8;font-weight:800;">☰ をドラッグして順位を変更 🍓</div>
</div>

<!-- モーダル -->
<div id="urlModal" class="modal-overlay hidden">
  <div class="modal-content">
    <div class="modal-title" id="modalItemTitle">URLを設定</div>
    <input type="url" id="modalUrlInput" placeholder="https://example.com/item" style="width: 100%;">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="window.closeUrlModal()">キャンセル</button>
      <button onclick="window.saveUrlModal()">保存</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDA9MSoP5GXpHqhzeHShGEwLfVgxjlCTxI",
  authDomain: "yosankeikaku.firebaseapp.com",
  projectId: "yosankeikaku",
  storageBucket: "yosankeikaku.firebasestorage.app",
  messagingSenderId: "612924615172",
  appId: "1:612924615172:web:1e7d51607826018a642351",
  measurementId: "G-S5L0BJLSM5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const yen = n => (n === null || n === undefined || isNaN(n)) ? '¥未定' : '¥' + n.toLocaleString('ja-JP');

let items = [];
let budget = 100000;
let currentRoomId = null;
let unsubscribe = null;
let wasOver = false;
let roomHistory = [];
let editingItemId = null;

try {
  items = JSON.parse(localStorage.getItem('plannedItems')) || [];
  const b = parseInt(localStorage.getItem('plannedBudget'), 10);
  if (!isNaN(b)) budget = b;
  roomHistory = JSON.parse(localStorage.getItem('roomHistory')) || [];
} catch (e) {}

items = items.filter(i => i && typeof i.name === 'string')
             .map((i, k) => ({ 
               id: i.id || Date.now() + '-' + k, 
               name: i.name, 
               price: (i.price === null || i.price === undefined || isNaN(i.price)) ? null : i.price, 
               url: i.url || '',
               pending: !!i.pending 
             }));
$('budget').value = budget;

function updateHistoryUI() {
  const select = $('roomHistorySelect');
  select.innerHTML = '<option value="">📜 過去の合言葉から選ぶ</option>';
  roomHistory.forEach(id => {
    const opt = document.createElement('option');
    opt.value = id;
    opt.textContent = id;
    select.appendChild(opt);
  });
}
updateHistoryUI();

async function save() {
  if (currentRoomId) {
    try {
      const docRef = doc(db, 'rooms', currentRoomId);
      await setDoc(docRef, { items, budget });
    } catch (e) {
      console.error("Firestore保存エラー:", e);
    }
  } else {
    try {
      localStorage.setItem('plannedItems', JSON.stringify(items));
      localStorage.setItem('plannedBudget', String(budget));
    } catch (e) {}
  }
}

function render() {
  const ul = $('list');
  ul.innerHTML = '';
  if (!items.length) {
    const activeItems = items.filter(i => !i.pending && i.price !== null);
    const isOver = activeItems.reduce((s, i) => s + (i.price || 0), 0) > budget;
    ul.innerHTML = `<div class="empty">欲しいものを追加してください ${isOver ? '🍔' : '🍓'}</div>`;
  }
  items.forEach(it => {
    const li = document.createElement('li');
    li.dataset.id = it.id;
    if (it.pending) li.classList.add('pending');
    
    const hasUrl = it.url && it.url.trim() !== '';
    const urlBtnText = hasUrl ? '🔗' : 'URL';
    const nmClass = hasUrl ? 'nm has-url' : 'nm';
    const isPriceUnset = it.price === null || it.price === undefined;

    li.innerHTML = '<div class="handle" aria-label="ドラッグで並べ替え"></div>' +
      '<div class="rank"></div>' +
      `<div class="mid"><div class="${nmClass}" title="${hasUrl ? 'タップしてWebページを開く' : ''}">${it.name}</div><div class="cum"></div></div>` +
      '<div class="right-group">' +
        `<div class="pr ${isPriceUnset ? 'unset' : ''}">${yen(it.price)}</div>` +
        `<button type="button" class="action-btn hold-btn ${it.pending ? 'active' : ''}">${it.pending ? '保留中' : '保留'}</button>` +
        `<button type="button" class="action-btn url-btn ${hasUrl ? 'active' : ''}">${urlBtnText}</button>` +
        '<button type="button" class="del" aria-label="削除">✕</button>' +
      '</div>';

    ul.appendChild(li);
  });
  refresh();
}

function refresh() {
  const byId = Object.fromEntries(items.map(i => [i.id, i]));
  let cum = 0, fit = 0, activeRank = 0;
  let total = 0;

  document.querySelectorAll('#list li').forEach((li) => {
    const it = byId[li.dataset.id];
    if (!it) return;

    if (it.pending) {
      li.querySelector('.rank').textContent = '-';
      li.querySelector('.cum').textContent = '保留中 💤';
      li.classList.remove('over');
    } else {
      activeRank++;
      const itemPrice = it.price || 0;
      cum += itemPrice;
      total += itemPrice;
      const ok = cum <= budget;
      if (ok && fit === activeRank - 1) fit = activeRank;

      li.classList.toggle('over', !ok && itemPrice > 0);
      li.querySelector('.rank').textContent = activeRank;
      li.querySelector('.cum').textContent = it.price === null ? '価格未定' : '累計 ' + yen(cum);
    }
  });
  
  const totalActive = items.filter(i => !i.pending).reduce((s, i) => s + (i.price || 0), 0);
  const isOver = totalActive > budget;

  if (isOver && !wasOver) {
    const wrap = $('mainWrap');
    wrap.classList.add('shock');
    setTimeout(() => wrap.classList.remove('shock'), 400);
  }
  wasOver = isOver;

  document.documentElement.classList.toggle('over-theme', isOver);
  $('titleText').textContent = isOver ? "🍔 買い物計画 🍩" : "🍓 買い物計画 🎀";
  $('footerHint').textContent = isOver ? "☰ をドラッグして順位を変更 🍩" : "☰ をドラッグして順位を変更 🍓";

  if (currentRoomId) {
    $('roomStatus').innerText = isOver ? `接続中：${currentRoomId} 🍔` : `接続中：${currentRoomId} 🎀`;
  }

  $('total').textContent = yen(totalActive);
  const pct = budget > 0 ? Math.min(totalActive / budget * 100, 100) : (totalActive ? 100 : 0);
  $('fill').style.width = pct + '\%';$('fill').classList.toggle('over', isOver);
  
  const activeCount = items.filter(i => !i.pending).length;
  $('verdict').textContent = !activeCount ? '' : fit === activeCount ? `全${fit}件、予算内だよん 🎀`
    : fit === 0 ? '1位でも予算を超えています...😭' : `予算内で買えるのは ${fit}位 まで 🍔`;
  
  $('remain').textContent = !activeCount ? '' : totalActive <= budget
    ? `残り ${yen(budget - totalActive)}` : `${yen(totalActive - budget)} 超過...😭`;
}

function addItem() {
  const name = $('name').value.trim();
  const priceVal = $('price').value.trim();
  if (!name) { $('name').focus(); return; }

  const price = priceVal === '' ? null : parseInt(priceVal, 10);
  items.push({ 
    id: Date.now() + '-' + Math.random().toString(36).slice(2, 6), 
    name, 
    price: (isNaN(price) || price < 0) ? null : price, 
    url: '', 
    pending: false 
  });
  
  $('name').value = '';$('price').value = '';
  render();
  save();
  $('name').focus();
}

$('addBtn').addEventListener('click', addItem);
['name', 'price'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); }));

$('budget').addEventListener('input', e => {
  const v = parseInt(e.target.value, 10);
  budget = isNaN(v) ? 0 : Math.max(v, 0);
  refresh();
  save();
});

$('list').addEventListener('click', e => {
  const li = e.target.closest('li');
  if (!li) return;
  const id = li.dataset.id;
  const item = items.find(i => i.id === id);
  if (!item) return;

  if (e.target.classList.contains('nm')) {
    if (item.url && item.url.trim() !== '') {
      let url = item.url.trim();
      if (!/^https?:\/\//i.test(url)) {
        url = 'https://' + url;
      }
      window.open(url, '_blank', 'noopener,noreferrer');
    }
    return;
  }

  if (e.target.classList.contains('pr')) {
    const currentPriceStr = item.price === null ? '' : item.price;
    const newPriceStr = prompt(`「${item.name}」の価格を入力してください:`, currentPriceStr);
    if (newPriceStr !== null) {
      const parsed = parseInt(newPriceStr.trim(), 10);
      item.price = (isNaN(parsed) || parsed < 0) ? null : parsed;
      render();
      save();
    }
    return;
  }

  if (e.target.classList.contains('hold-btn')) {
    item.pending = !item.pending;
    render();
    save();
    return;
  }

  if (e.target.classList.contains('url-btn')) {
    editingItemId = id;
    $('modalItemTitle').textContent = `「${item.name}」のURL`;
    $('modalUrlInput').value = item.url || '';
    $('urlModal').classList.remove('hidden');$('modalUrlInput').focus();
    return;
  }

  if (e.target.classList.contains('del')) {
    items = items.filter(i => i.id !== id);
    render();
    save();
    return;
  }
});

function closeUrlModal() {
  editingItemId = null;
  $('urlModal').classList.add('hidden');
}

function saveUrlModal() {
  if (!editingItemId) return;
  const item = items.find(i => i.id === editingItemId);
  if (item) {
    item.url = $('modalUrlInput').value.trim();
    render();
    save();
  }
  closeUrlModal();
}

function joinRoom(targetId) {
  const roomId = targetId || $('roomIdInput').value.trim();
  if (!roomId) return;

  roomHistory = [roomId, ...roomHistory.filter(id => id !== roomId)];
  try {
    localStorage.setItem('roomHistory', JSON.stringify(roomHistory));
  } catch (e) {}
  updateHistoryUI();

  if (unsubscribe) unsubscribe();

  currentRoomId = roomId;
  $('roomIdInput').value = roomId;
  
  const activeItems = items.filter(i => !i.pending);
  const isOver = activeItems.reduce((s, i) => s + (i.price || 0), 0) > budget;
  $('roomStatus').innerText = isOver ? `接続中：${roomId} 🍔` : `接続中：${roomId} 🎀`;

  const docRef = doc(db, 'rooms', currentRoomId);
  unsubscribe = onSnapshot(docRef, (snapshot) => {
    if (snapshot.exists()) {
      const data = snapshot.data();
      items = (data.items || []).map(i => ({ 
        ...i, 
        price: (i.price === null || i.price === undefined || isNaN(i.price)) ? null : i.price,
        url: i.url || '', 
        pending: !!i.pending 
      }));
      if (data.budget !== undefined) {
        budget = data.budget;
        $('budget').value = budget;
      }
    } else {
      items = [];
      setDoc(docRef, { items, budget });
    }
    render();
  }, (error) => {
    console.error("Firestore受信エラー:", error);
    $('roomStatus').innerText = `接続エラー：アクセス権限がありません`;
  });
}

function selectRoomFromHistory(val) {
  if (val) {
    joinRoom(val);
  }
}

let drag = null;
$('list').addEventListener('pointerdown', e => {
  const h = e.target.closest('.handle');
  if (!h) return;
  e.preventDefault();
  const li = h.closest('li');
  h.setPointerCapture(e.pointerId);
  li.classList.add('dragging');
  drag = { li, h, pid: e.pointerId };
  if (navigator.vibrate) navigator.vibrate(10);
});

$('list').addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.pid) return;
  const { li } = drag, y = e.clientY;
  const mid = el => { const r = el.getBoundingClientRect(); return r.top + r.height / 2; };
  let prev = li.previousElementSibling, next = li.nextElementSibling, moved = false;
  while (prev && y < mid(prev)) { li.parentNode.insertBefore(li, prev); prev = li.previousElementSibling; moved = true; }
  while (next && y > mid(next)) { li.parentNode.insertBefore(next, li); next = li.nextElementSibling; moved = true; }
  if (moved) {
    const order = [...document.querySelectorAll('#list li')].map(x => x.dataset.id);
    items.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
    refresh();
  }
  const edge = 70;
  if (y < edge) window.scrollBy(0, -12);
  else if (y > window.innerHeight - edge) window.scrollBy(0, 12);
});

function endDrag(e) {
  if (!drag || e.pointerId !== drag.pid) return;
  drag.li.classList.remove('dragging');
  drag = null;
  save();
}
$('list').addEventListener('pointerup', endDrag);$('list').addEventListener('pointercancel', endDrag);

window.joinRoom = joinRoom;
window.selectRoomFromHistory = selectRoomFromHistory;
window.closeUrlModal = closeUrlModal;
window.saveUrlModal = saveUrlModal;

render();
</script>
</body>
</html>
