<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>買い物計画 - リアルタイム共有版</title>
<style>
:root {
  --bg: #fdf0f4;
  --card: #ffffff;
  --ink: #4a3e43;
  --sub: #7a4b5d;
  --line: #f1c6d3;
  --ok: #e91e63;
  --ng: #8b0000;
  --acc: #d87093;
  --acc-hover: #c25278;
  --room-bg: #fce4ec;
  --deco-left: "🌸";
  --deco-right: "🍒";
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  transition: background-color 0.5s ease, color 0.5s ease;
}

/* 🥀 予算オーバー時の「悲しい・どんより枯れ葉」テーマ 🥀 */
:root.over-theme {
  --bg: #2b2b2e;
  --card: #3a3a3e;
  --ink: #d0c8b8;
  --sub: #a09888;
  --line: #55504a;
  --acc: #5c554e;
  --acc-hover: #48423c;
  --room-bg: #333130;
  --deco-left: "🥀";
  --deco-right: "🍂";
}

* { box-sizing: border-box; }

body { 
  margin: 0; 
  background: var(--bg); 
  color: var(--ink); 
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Hiragino Sans", "Noto Sans JP", sans-serif; 
  -webkit-tap-highlight-color: transparent; 
  transition: background-color 0.5s ease, color 0.5s ease;
}

@keyframes shake {
  0% { transform: translate(0, 0); }
  20% { transform: translate(-4px, 3px); }
  40% { transform: translate(4px, -3px); }
  60% { transform: translate(-3px, -2px); }
  80% { transform: translate(3px, 2px); }
  100% { transform: translate(0, 0); }
}

.wrap { 
  max-width: 520px; 
  margin: 0 auto; 
  padding: 16px 16px 40px; 
  position: relative;
}

.wrap.shock {
  animation: shake 0.4s ease-in-out;
}

h1 { 
  font-size: 20px; 
  margin: 8px 0 14px; 
  text-align: center; 
  color: var(--sub); 
  transition: color 0.5s ease;
}

.panel::before {
  content: var(--deco-left);
  font-size: 26px;
  position: absolute;
  top: -14px;
  left: 12px;
}

.panel::after {
  content: var(--deco-right);
  font-size: 26px;
  position: absolute;
  top: -14px;
  right: 12px;
}

.room-box {
  background: var(--room-bg);
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 14px;
  border: 1px solid var(--line);
  transition: background-color 0.5s ease, border-color 0.5s ease;
}

.room-status { 
  font-size: 0.85em; 
  color: var(--sub); 
  text-align: center; 
  font-weight: bold; 
  margin-top: 6px; 
}

.history-select {
  width: 100%;
  margin-top: 8px;
  padding: 8px;
  font-size: 0.9rem;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  outline: none;
}

.panel { 
  position: sticky; 
  top: env(safe-area-inset-top, 0px); 
  z-index: 5; 
  background: var(--card); 
  border: 1px solid var(--line); 
  border-radius: 16px; 
  padding: 16px; 
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
  transition: background-color 0.5s ease, border-color 0.5s ease;
}

.row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.big { font-size: 24px; font-weight: 700; color: var(--sub); transition: color 0.5s ease; }
.sub { font-size: 13px; color: var(--sub); transition: color 0.5s ease; }
.bar { height: 14px; background: var(--line); border-radius: 7px; overflow: hidden; margin: 10px 0 8px; }
.fill { height: 100%; width: 0; background: var(--ok); transition: width .25s, background .5s ease; }
.fill.over { background: #b71c1c; }

.verdict { font-size: 15px; font-weight: 600; color: var(--sub); transition: color 0.5s ease; }

label.budget { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--sub); }

input { 
  font: inherit; 
  font-size: 16px; 
  color: var(--ink); 
  background: var(--card); 
  border: 1px solid var(--line); 
  border-radius: 8px; 
  padding: 10px; 
  min-width: 0; 
  outline: none;
  transition: background-color 0.5s ease, border-color 0.5s ease, color 0.5s ease;
}
input:focus { border-color: var(--acc); }

#budget { width: 110px; text-align: right; }

.add { display: flex; gap: 8px; margin: 16px 0; }
#name { flex: 1; }
#price { width: 96px; }

button { 
  font: inherit; 
  font-size: 16px; 
  border: 0; 
  border-radius: 8px; 
  padding: 10px 14px; 
  background: var(--acc); 
  color: #fff; 
  cursor: pointer; 
  font-weight: bold;
  transition: background-color 0.5s ease;
}
button:hover { background: var(--acc-hover); }

ul { list-style: none; margin: 0; padding: 0; }

/* 🌟 リストのレイアウトを調整（ボタン類を綺麗に右揃え） */
li { 
  display: flex; 
  align-items: center; 
  gap: 6px; 
  background: var(--card); 
  border: 1px solid var(--line); 
  border-left: 5px solid var(--ok); 
  border-radius: 10px; 
  padding: 8px 8px 8px 4px; 
  margin-bottom: 8px; 
  user-select: none; 
  -webkit-user-select: none; 
  transition: background-color 0.5s ease, border-color 0.5s ease, opacity 0.3s ease;
}

li.over { border-left-color: #b71c1c; }
li.over .nm, li.over .pr { opacity: .4; text-decoration: line-through; }

li.pending {
  border-left-color: #9e9e9e !important;
  background: rgba(0, 0, 0, 0.03);
  opacity: 0.6;
}
li.pending .rank { color: #9e9e9e; }
li.pending .nm { text-decoration: line-through; }

li.dragging { box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); border-color: var(--acc); position: relative; z-index: 3; transform: scale(1.02); }

.handle { touch-action: none; width: 28px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--sub); font-size: 20px; cursor: grab; flex: none; }
.rank { width: 18px; font-weight: 700; color: var(--sub); flex: none; text-align: center; font-size: 0.9rem; }
.mid { flex: 1; min-width: 0; padding-right: 4px; }

/* 右側のボタン・金額グループ（右揃えで固定） */
.right-group {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.nm { font-weight: 600; overflow-wrap: anywhere; }
.nm.has-url { 
  color: #1e88e5; 
  text-decoration: underline; 
  cursor: pointer; 
}
:root.over-theme .nm.has-url {
  color: #64b5f6;
}

.cum { font-size: 11px; color: var(--sub); }

/* 金額の幅・位置を固定して揃える */
.pr { 
  font-weight: 700; 
  white-space: nowrap; 
  color: var(--sub); 
  font-size: 0.95rem; 
  text-align: right;
  min-width: 68px; /* 金額表示の幅を固定して「保留」の位置を一直線に揃える */
}

/* ボタン幅・デザインの統一 */
.action-btn { 
  background: transparent; 
  color: var(--sub); 
  padding: 6px 8px; 
  font-size: 11px; 
  border: 1px solid var(--line); 
  border-radius: 6px; 
  line-height: 1; 
  flex-shrink: 0;
  min-width: 48px; /* ボタン最小幅を確保 */
  text-align: center;
}
.action-btn.active {
  background: var(--line);
  font-weight: bold;
}
.action-btn.hold-btn.active {
  background: #9e9e9e;
  color: #fff;
  border-color: #9e9e9e;
}

.del { background: transparent; color: #e53935; padding: 6px 6px; font-size: 18px; line-height: 1; flex-shrink: 0; }
.empty { text-align: center; color: var(--sub); padding: 28px 0; }

/* 🌟 URL入力専用モーダル */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
}
.modal-overlay.hidden { display: none; }
.modal-content {
  background: var(--card);
  border-radius: 16px;
  padding: 20px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  border: 1px solid var(--line);
}
.modal-title { font-size: 1.1rem; font-weight: bold; color: var(--sub); margin-bottom: 12px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.btn-cancel { background: #9e9e9e; }
</style>
</head>
<body>
<div class="wrap" id="mainWrap">
  <h1 id="titleText">🌸 買い物計画 🍒</h1>

  <!-- ルーム（合言葉）機能 -->
  <div class="room-box">
    <div class="add" style="margin: 0;">
      <input type="text" id="roomIdInput" placeholder="合言葉（ルームID）を入力">
      <button onclick="window.joinRoom()">接続</button>
    </div>
    <!-- 📜 合言葉の履歴ドロップダウン -->
    <select id="roomHistorySelect" class="history-select" onchange="window.selectRoomFromHistory(this.value)">
      <option value="">📜 過去の合言葉から選ぶ</option>
    </select>
    <div id="roomStatus" class="room-status">未接続（ローカル保存中）</div>
  </div>

  <div class="panel">
    <div class="row">
      <span class="big" id="total">¥0</span>
      <label class="budget">予算 ¥<input type="number" id="budget" inputmode="numeric" min="0"></label>
    </div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="verdict" id="verdict"></div>
    <div class="sub" id="remain"></div>
  </div>

  <div class="add">
    <input type="text" id="name" placeholder="欲しいもの" maxlength="40">
    <input type="number" id="price" inputmode="numeric" placeholder="価格" min="0">
    <button id="addBtn">追加</button>
  </div>

  <ul id="list"></ul>
  <div class="sub" id="footerHint" style="text-align:center;margin-top:12px">左の「≡」をドラッグで並べ替え 🌸</div>
</div>

<!-- 🌟 URL設定ポップアップモーダル -->
<div id="urlModal" class="modal-overlay hidden">
  <div class="modal-content">
    <div class="modal-title" id="modalItemTitle">URLを設定</div>
    <input type="url" id="modalUrlInput" placeholder="https://example.com/item" style="width: 100%;">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="window.closeUrlModal()">キャンセル</button>
      <button onclick="window.saveUrlModal()">保存</button>
    </div>
  </div>
</div>

<!-- Firebase SDK (ES Module) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDA9MSoP5GXpHqhzeHShGEwLfVgxjlCTxI",
  authDomain: "yosankeikaku.firebaseapp.com",
  projectId: "yosankeikaku",
  storageBucket: "yosankeikaku.firebasestorage.app",
  messagingSenderId: "612924615172",
  appId: "1:612924615172:web:1e7d51607826018a642351",
  measurementId: "G-S5L0BJLSM5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const yen = n => '¥' + n.toLocaleString('ja-JP');

let items = [];
let budget = 100000;
let currentRoomId = null;
let unsubscribe = null;
let wasOver = false;
let roomHistory = [];
let editingItemId = null;

// 初期読み込み（Local Storage）
try {
  items = JSON.parse(localStorage.getItem('plannedItems')) || [];
  const b = parseInt(localStorage.getItem('plannedBudget'), 10);
  if (!isNaN(b)) budget = b;
  roomHistory = JSON.parse(localStorage.getItem('roomHistory')) || [];
} catch (e) {}

items = items.filter(i => i && typeof i.name === 'string' && Number.isFinite(i.price))
             .map((i, k) => ({ 
               id: i.id || Date.now() + '-' + k, 
               name: i.name, 
               price: i.price, 
               url: i.url || '',
               pending: !!i.pending 
             }));
$('budget').value = budget;

function updateHistoryUI() {
  const select = $('roomHistorySelect');
  select.innerHTML = '<option value="">📜 過去の合言葉から選ぶ</option>';
  roomHistory.forEach(id => {
    const opt = document.createElement('option');
    opt.value = id;
    opt.textContent = id;
    select.appendChild(opt);
  });
}
updateHistoryUI();

async function save() {
  if (currentRoomId) {
    try {
      const docRef = doc(db, 'rooms', currentRoomId);
      await setDoc(docRef, { items, budget });
    } catch (e) {
      console.error("Firestore保存エラー:", e);
    }
  } else {
    try {
      localStorage.setItem('plannedItems', JSON.stringify(items));
      localStorage.setItem('plannedBudget', String(budget));
    } catch (e) {}
  }
}

function render() {
  const ul = $('list');
  ul.innerHTML = '';
  if (!items.length) {
    const activeItems = items.filter(i => !i.pending);
    const isOver = activeItems.reduce((s, i) => s + i.price, 0) > budget;
    ul.innerHTML = `<div class="empty">欲しいものを追加してください ${isOver ? '🥀' : '🌸'}</div>`;
  }
  items.forEach(it => {
    const li = document.createElement('li');
    li.dataset.id = it.id;
    if (it.pending) li.classList.add('pending');
    
    const hasUrl = it.url && it.url.trim() !== '';
    const urlBtnText = hasUrl ? '🔗URL' : 'URL';
    const nmClass = hasUrl ? 'nm has-url' : 'nm';

    li.innerHTML = '<div class="handle" aria-label="ドラッグで並べ替え">≡</div>' +
      '<div class="rank"></div>' +
      `<div class="mid"><div class="${nmClass}" title="${hasUrl ? 'タップしてWebページを開く' : ''}">${it.name}</div><div class="cum"></div></div>` +
      '<div class="right-group">' +
        `<div class="pr"></div>` +
        `<button type="button" class="action-btn hold-btn ${it.pending ? 'active' : ''}">${it.pending ? '保留中' : '保留'}</button>` +
        `<button type="button" class="action-btn url-btn ${hasUrl ? 'active' : ''}">${urlBtnText}</button>` +
        '<button type="button" class="del" aria-label="削除">×</button>' +
      '</div>';

    li.querySelector('.pr').textContent = yen(it.price);
    ul.appendChild(li);
  });
  refresh();
}

function refresh() {
  const byId = Object.fromEntries(items.map(i => [i.id, i]));
  let cum = 0, fit = 0, activeRank = 0;
  let total = 0;

  document.querySelectorAll('#list li').forEach((li) => {
    const it = byId[li.dataset.id];
    if (!it) return;

    if (it.pending) {
      li.querySelector('.rank').textContent = '-';
      li.querySelector('.cum').textContent = '保留中 💤';
      li.classList.remove('over');
    } else {
      activeRank++;
      cum += it.price;
      total += it.price;
      const ok = cum <= budget;
      if (ok && fit === activeRank - 1) fit = activeRank;

      li.classList.toggle('over', !ok);
      li.querySelector('.rank').textContent = activeRank;
      li.querySelector('.cum').textContent = '累計 ' + yen(cum);
    }
  });
  
  const totalActive = items.filter(i => !i.pending).reduce((s, i) => s + i.price, 0);
  const isOver = totalActive > budget;

  if (isOver && !wasOver) {
    const wrap = $('mainWrap');
    wrap.classList.add('shock');
    setTimeout(() => wrap.classList.remove('shock'), 400);
  }
  wasOver = isOver;

  document.documentElement.classList.toggle('over-theme', isOver);
  $('titleText').textContent = isOver ? "🥀 買い物計画 💸" : "🌸 買い物計画 🍒";
  $('footerHint').textContent = isOver ? "左の「≡」をドラッグで並べ替え 🍂" : "左の「≡」をドラッグで並べ替え 🌸";

  if (currentRoomId) {
    $('roomStatus').innerText = isOver ? `接続中：${currentRoomId} 🥀` : `接続中：${currentRoomId} 🍒`;
  }

  $('total').textContent = yen(totalActive);
  const pct = budget > 0 ? Math.min(totalActive / budget * 100, 100) : (totalActive ? 100 : 0);
  $('fill').style.width = pct + '\%';$('fill').classList.toggle('over', isOver);
  
  const activeCount = items.filter(i => !i.pending).length;
  $('verdict').textContent = !activeCount ? '' : fit === activeCount ? `全${fit}件、予算内です 🌸`
    : fit === 0 ? '1位でも予算を超えています...😭' : `予算内で買えるのは ${fit}位 まで 🥀`;
  
  $('remain').textContent = !activeCount ? '' : totalActive <= budget
    ? `残り ${yen(budget - totalActive)}` : `${yen(totalActive - budget)} 超過...💸`;
}

function addItem() {
  const name = $('name').value.trim();
  const price = parseInt($('price').value, 10);
  if (!name || isNaN(price) || price < 0) { (name ? $('price') :$('name')).focus(); return; }
  items.push({ id: Date.now() + '-' + Math.random().toString(36).slice(2, 6), name, price, url: '', pending: false });
  $('name').value = '';$('price').value = '';
  render();
  save();
  $('name').focus();
}

$('addBtn').addEventListener('click', addItem);
['name', 'price'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); }));

$('budget').addEventListener('input', e => {
  const v = parseInt(e.target.value, 10);
  budget = isNaN(v) ? 0 : Math.max(v, 0);
  refresh();
  save();
});

// アイテムリストのイベント処理
$('list').addEventListener('click', e => {
  const li = e.target.closest('li');
  if (!li) return;
  const id = li.dataset.id;
  const item = items.find(i => i.id === id);
  if (!item) return;

  if (e.target.classList.contains('nm')) {
    if (item.url && item.url.trim() !== '') {
      let url = item.url.trim();
      if (!/^https?:\/\//i.test(url)) {
        url = 'https://' + url;
      }
      window.open(url, '_blank', 'noopener,noreferrer');
    }
    return;
  }

  if (e.target.classList.contains('hold-btn')) {
    item.pending = !item.pending;
    render();
    save();
    return;
  }

  if (e.target.classList.contains('url-btn')) {
    editingItemId = id;
    $('modalItemTitle').textContent = `「${item.name}」のURL`;
    $('modalUrlInput').value = item.url || '';
    $('urlModal').classList.remove('hidden');$('modalUrlInput').focus();
    return;
  }

  if (e.target.classList.contains('del')) {
    items = items.filter(i => i.id !== id);
    render();
    save();
    return;
  }
});

function closeUrlModal() {
  editingItemId = null;
  $('urlModal').classList.add('hidden');
}

function saveUrlModal() {
  if (!editingItemId) return;
  const item = items.find(i => i.id === editingItemId);
  if (item) {
    item.url = $('modalUrlInput').value.trim();
    render();
    save();
  }
  closeUrlModal();
}

function joinRoom(targetId) {
  const roomId = targetId || $('roomIdInput').value.trim();
  if (!roomId) return;

  roomHistory = [roomId, ...roomHistory.filter(id => id !== roomId)];
  try {
    localStorage.setItem('roomHistory', JSON.stringify(roomHistory));
  } catch (e) {}
  updateHistoryUI();

  if (unsubscribe) unsubscribe();

  currentRoomId = roomId;
  $('roomIdInput').value = roomId;
  
  const activeItems = items.filter(i => !i.pending);
  const isOver = activeItems.reduce((s, i) => s + i.price, 0) > budget;
  $('roomStatus').innerText = isOver ? `接続中：${roomId} 🥀` : `接続中：${roomId} 🍒`;

  const docRef = doc(db, 'rooms', currentRoomId);
  unsubscribe = onSnapshot(docRef, (snapshot) => {
    if (snapshot.exists()) {
      const data = snapshot.data();
      items = (data.items || []).map(i => ({ 
        ...i, 
        url: i.url || '', 
        pending: !!i.pending 
      }));
      if (data.budget !== undefined) {
        budget = data.budget;
        $('budget').value = budget;
      }
    } else {
      items = [];
      setDoc(docRef, { items, budget });
    }
    render();
  }, (error) => {
    console.error("Firestore受信エラー:", error);
    $('roomStatus').innerText = `接続エラー：アクセス権限がありません`;
  });
}

function selectRoomFromHistory(val) {
  if (val) {
    joinRoom(val);
  }
}

// つまみドラッグ並べ替え
let drag = null;
$('list').addEventListener('pointerdown', e => {
  const h = e.target.closest('.handle');
  if (!h) return;
  e.preventDefault();
  const li = h.closest('li');
  h.setPointerCapture(e.pointerId);
  li.classList.add('dragging');
  drag = { li, h, pid: e.pointerId };
  if (navigator.vibrate) navigator.vibrate(10);
});

$('list').addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.pid) return;
  const { li } = drag, y = e.clientY;
  const mid = el => { const r = el.getBoundingClientRect(); return r.top + r.height / 2; };
  let prev = li.previousElementSibling, next = li.nextElementSibling, moved = false;
  while (prev && y < mid(prev)) { li.parentNode.insertBefore(li, prev); prev = li.previousElementSibling; moved = true; }
  while (next && y > mid(next)) { li.parentNode.insertBefore(next, li); next = li.nextElementSibling; moved = true; }
  if (moved) {
    const order = [...document.querySelectorAll('#list li')].map(x => x.dataset.id);
    items.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
    refresh();
  }
  const edge = 70;
  if (y < edge) window.scrollBy(0, -12);
  else if (y > window.innerHeight - edge) window.scrollBy(0, 12);
});

function endDrag(e) {
  if (!drag || e.pointerId !== drag.pid) return;
  drag.li.classList.remove('dragging');
  drag = null;
  save();
}
$('list').addEventListener('pointerup', endDrag);$('list').addEventListener('pointercancel', endDrag);

window.joinRoom = joinRoom;
window.selectRoomFromHistory = selectRoomFromHistory;
window.closeUrlModal = closeUrlModal;
window.saveUrlModal = saveUrlModal;

render();
</script>
