<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>買い物計画アプリ - リアルタイム共有版</title>
<style>
body { 
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
  margin: 20px; 
  background-color: #fdf0f4; /* 優しい淡いピンクの背景 */
  color: #4a3e43; 
}
h1 { 
  text-align: center; 
  color: #7a4b5d; 
  font-size: 1.5rem; 
  margin-bottom: 20px; 
}
.container { 
  max-width: 500px; 
  margin: 0 auto; 
  background: #ffffff; 
  padding: 20px; 
  border-radius: 16px; 
  box-shadow: 0 4px 12px rgba(186, 110, 137, 0.15); 
  position: relative; /* デコレーションの位置基準 */
}

/* 🌸🍒 角のデコレーションアイコン 🍒🌸 */
.container::before {
  content: "🌸";
  font-size: 28px;
  position: absolute;
  top: -15px;
  left: 10px;
}

.container::after {
  content: "🍒";
  font-size: 28px;
  position: absolute;
  top: -15px;
  right: 10px;
}

.input-group { display: flex; gap: 8px; margin-bottom: 15px; }
input[type="text"] { 
  flex-grow: 1; 
  padding: 10px 12px; 
  border: 1px solid #f1c6d3; 
  border-radius: 8px; 
  background-color: #fff9fa;
  color: #4a3e43;
  font-size: 0.95rem;
  outline: none;
}
input[type="text"]:focus, input[type="number"]:focus {
  border-color: #d87093;
}
input[type="number"] { 
  width: 90px; 
  padding: 10px 12px; 
  border: 1px solid #f1c6d3; 
  border-radius: 8px; 
  background-color: #fff9fa;
  color: #4a3e43;
  font-size: 0.95rem;
  outline: none;
}
button { 
  padding: 10px 16px; 
  background-color: #d87093; /* メインカラー（ローズピンク） */
  color: white; 
  border: none; 
  border-radius: 8px; 
  cursor: pointer; 
  font-weight: bold;
  font-size: 0.9rem;
  transition: background-color 0.2s;
}
button:hover { background-color: #c25278; }

ul { list-style: none; padding: 0; position: relative; margin: 0; }
li { 
  background: #fff5f7; 
  border: 1px solid #fce4ec; 
  margin-bottom: 8px; 
  padding: 12px; 
  border-radius: 10px; 
  display: flex; 
  justify-content: space-between; 
  align-items: center; 
  touch-action: none; 
  user-select: none;
}
li.dragging { opacity: 0.7; background: #f8bbd0; border: 2px dashed #d87093; }

.gauge-container { margin-top: 25px; }
.gauge-label { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 6px; color: #7a4b5d; }
.gauge-bar-bg { background-color: #f8e1e7; border-radius: 10px; height: 18px; overflow: hidden; }
.gauge-bar-fill { height: 100%; width: 0%; background-color: #e91e63; transition: width 0.3s; }
.item-price { font-weight: bold; color: #7a4b5d; }

.delete-btn { 
  background-color: #ef5350; 
  color: white; 
  border: none; 
  padding: 6px 10px; 
  border-radius: 6px; 
  cursor: pointer; 
  margin-left: 10px; 
  font-size: 0.8rem;
}
.delete-btn:hover { background-color: #e53935; }

.room-box { 
  background: #fce4ec; 
  padding: 12px; 
  border-radius: 10px; 
  margin-bottom: 20px; 
}
.room-status { font-size: 0.85em; color: #ad1457; text-align: center; font-weight: bold; margin-top: 6px; }
</style>
</head>
<body>

<div class="container">
<h1>🌸 買い物計画 🍒</h1>

<!-- ルーム機能エリア -->
<div class="room-box">
  <div class="input-group" style="margin-bottom: 0;">
    <input type="text" id="roomIdInput" placeholder="合言葉（ルームID）を入力">
    <button onclick="window.joinRoom()">接続</button>
  </div>
  <div id="roomStatus" class="room-status">未接続（ローカル保存中）</div>
</div>

<div class="input-group">
<input type="text" id="itemName" placeholder="欲しいものを入力">
<input type="number" id="itemPrice" placeholder="価格">
<button onclick="window.addItem()">追加</button>
</div>

<ul id="itemList"></ul>

<div class="gauge-container">
<div class="gauge-label">
<span>合計金額 🌸</span>
<span id="totalDisplay">¥0</span>
</div>
<div class="gauge-bar-bg">
<div id="gaugeBar" class="gauge-bar-fill"></div>
</div>
</div>
</div>

<!-- Firebase CDN読み込みと初期化 -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDA9MSoP5GXpHqhzeHShGEwLfVgxjlCTxI",
  authDomain: "yosankeikaku.firebaseapp.com",
  projectId: "yosankeikaku",
  storageBucket: "yosankeikaku.firebasestorage.app",
  messagingSenderId: "612924615172",
  appId: "1:612924615172:web:1e7d51607826018a642351",
  measurementId: "G-S5L0BJLSM5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentRoomId = null;
let unsubscribe = null;
let items = JSON.parse(localStorage.getItem('plannedItems')) || [];
const maxBudget = 100000;

function updateUI() {
  const itemList = document.getElementById('itemList');
  itemList.innerHTML = '';

  let total = 0;
  items.forEach((item, index) => {
    total += item.price;
    const li = document.createElement('li');
    li.dataset.index = index;
    li.innerHTML = `
      <span>🌸 ${index + 1}. ${item.name}</span>
      <div>
        <span class="item-price">¥${item.price.toLocaleString()}</span>
        <button class="delete-btn" onclick="window.deleteItem(${index})">削除</button>
      </div>
    `;

    li.addEventListener('touchstart', handleTouchStart, { passive: false });
    li.addEventListener('touchmove', handleTouchMove, { passive: false });
    li.addEventListener('touchend', handleTouchEnd);

    itemList.appendChild(li);
  });

  document.getElementById('totalDisplay').innerText = `¥${total.toLocaleString()}`;
  const gaugePercentage = Math.min((total / maxBudget) * 100, 100);
  document.getElementById('gaugeBar').style.width = `${gaugePercentage}%`;

  if (!currentRoomId) {
    localStorage.setItem('plannedItems', JSON.stringify(items));
  }
}

async function syncToFirestore() {
  if (currentRoomId) {
    try {
      const docRef = doc(db, 'rooms', currentRoomId);
      await setDoc(docRef, { items });
    } catch (error) {
      console.error("Firestoreへの保存エラー:", error);
      alert("保存に失敗しました。Firebaseのルール設定を確認してください。");
    }
  } else {
    updateUI();
  }
}

function addItem() {
  const nameInput = document.getElementById('itemName');
  const priceInput = document.getElementById('itemPrice');
  const name = nameInput.value.trim();
  const price = parseInt(priceInput.value);

  if (name && !isNaN(price)) {
    items.push({ name, price });
    nameInput.value = '';
    priceInput.value = '';
    updateUI();
    syncToFirestore();
  }
}

function deleteItem(index) {
  items.splice(index, 1);
  updateUI();
  syncToFirestore();
}

function joinRoom(targetId) {
  const roomId = targetId || document.getElementById('roomIdInput').value.trim();
  if (!roomId) return;

  if (unsubscribe) unsubscribe();

  currentRoomId = roomId;
  document.getElementById('roomIdInput').value = roomId;
  document.getElementById('roomStatus').innerText = `接続中：${roomId} 🍒`;

  const docRef = doc(db, 'rooms', currentRoomId);
  unsubscribe = onSnapshot(docRef, (snapshot) => {
    if (snapshot.exists()) {
      items = snapshot.data().items || [];
    } else {
      items = [];
      setDoc(docRef, { items });
    }
    updateUI();
  }, (error) => {
    console.error("Firestore受信エラー:", error);
    document.getElementById('roomStatus').innerText = `接続エラー：アクセス権限がありません`;
  });
}

// タッチドラッグ制御
let draggedIndex = null;
let activeElement = null;

function handleTouchStart(e) {
  if (e.target.tagName === 'BUTTON') return;
  draggedIndex = parseInt(this.dataset.index);
  activeElement = this;
  this.classList.add('dragging');
}

function handleTouchMove(e) {
  if (draggedIndex === null) return;
  e.preventDefault();

  const touch = e.touches[0];
  const targetElement = document.elementFromPoint(touch.clientX, touch.clientY);

  if (!targetElement) return;

  const targetLi = targetElement.closest('li');
  if (targetLi && targetLi !== activeElement) {
    const targetIndex = parseInt(targetLi.dataset.index);
    if (!isNaN(targetIndex)) {
      const movedItem = items.splice(draggedIndex, 1)[0];
      items.splice(targetIndex, 0, movedItem);
      draggedIndex = targetIndex;
      
      const newLis = document.querySelectorAll('#itemList li');
      activeElement = newLis[targetIndex];
      if (activeElement) activeElement.classList.add('dragging');
      
      updateUI();
    }
  }
}

function handleTouchEnd() {
  if (activeElement) {
    activeElement.classList.remove('dragging');
  }
  draggedIndex = null;
  activeElement = null;
  syncToFirestore();
}

window.addItem = addItem;
window.deleteItem = deleteItem;
window.joinRoom = joinRoom;

updateUI();
</script>

</body>
</html>
